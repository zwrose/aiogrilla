[project]
name = "aiogrilla"
version = "0.2.0"
description = "Async client for Grilla Grills Alpha Connect smokers (unofficial)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "zwrose" }]
keywords = ["grilla", "grill", "smoker", "bbq", "asyncio", "aws-iot", "mqtt", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pycognito>=2024.5.1",
    "boto3>=1.34,<2",
    "awsiotsdk>=1.21,<2",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pyright>=1.1"]

[project.urls]
Homepage = "https://github.com/zwrose/aiogrilla"
Source = "https://github.com/zwrose/aiogrilla"
Issues = "https://github.com/zwrose/aiogrilla/issues"
Changelog = "https://github.com/zwrose/aiogrilla/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiogrilla"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"homeassistant".msg = "aiogrilla must never import homeassistant (boundary rule)."

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
